[platformio]
default_envs = platform

;BRIDGE ESP32 
[env:bridge]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 460800
build_src_filter = +<bridge/*>

; PLATFORM ESP32
[env:platform]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 460800
build_src_filter = +<platform/*>

; LDC1101 driver configuration (consumed by lib/LDC1101/src/ldc1101.cpp).
; Pins match the Platform board's existing LDC wiring. SPI host + clock are
; only used by the ESP-IDF variant of the driver; harmless if the driver uses
; Arduino SPI. Re-pin here if the hardware changes.
build_flags =
    -D LDC_MOSI=9
    -D LDC_MISO=8
    -D LDC_SCK=7
    -D LDC_CS=6
    -D LDC_SPI_HOST=SPI3_HOST
    -D LDC_SPI_CLOCK_HZ=100000

lib_deps =
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@^1.3.2